appId: sh.finder.app
productName: finder.sh
copyright: © jafb321
directories:
  buildResources: build
  output: dist
files:
  - '**/*'
  - '!**/.vscode/*'
  - '!src/*'
  - '!docs/*'
  - '!branding/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.ts'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,CLAUDE.md}'
  - '!{.env,.env.*,.npmrc,.nvmrc,pnpm-lock.yaml,pnpm-workspace.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # onnxruntime-node ships every platform; keep only macOS arm64
  - '!node_modules/onnxruntime-node/bin/napi-v*/{linux,win32}/**'
  - '!node_modules/onnxruntime-node/bin/napi-v*/darwin/x64/**'
  # onnxruntime-web is only required as a loader stub by transformers.js in Node; its wasm never runs here
  - '!node_modules/onnxruntime-web/dist/**'
  - 'node_modules/onnxruntime-web/dist/ort.webgpu.min.js'
  - 'node_modules/onnxruntime-web/dist/ort.webgpu.min.mjs'
  - 'node_modules/onnxruntime-web/dist/ort.webgpu.bundle.min.mjs'
# Native binaries and anything spawned as a child process must live outside app.asar.
asarUnpack:
  - resources/**
  - node_modules/sqlite-vec-darwin-arm64/**
  - node_modules/@img/**
  - node_modules/onnxruntime-node/bin/**
  - node_modules/better-sqlite3/build/**
  - node_modules/ffmpeg-static/**
mac:
  icon: build/icon.icns
  category: public.app-category.photography
  target:
    - target: dmg
      arch: [arm64]
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSPhotoLibraryUsageDescription: finder.sh indexes the photo folders you choose.
  # unsigned for now: first launch needs right-click → Open (or `xattr -d com.apple.quarantine`)
  identity: null
  notarize: false
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
npmRebuild: false
